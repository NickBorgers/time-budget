name: check

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      # The Swift image has no make, which the devcontainer's setup.sh also adds.
      - run: apt-get update -qq && apt-get install -y -qq make
      # The same target the devcontainer runs, so CI cannot disagree with a
      # clean local checkout.
      - run: make check

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The core must build and pass on the platform the app ships on. The Mac
      # app target will be built here once it exists.
      - run: swift build
      - run: swift test
