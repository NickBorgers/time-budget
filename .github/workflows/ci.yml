name: check

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      # The Swift image has no make, which the devcontainer's setup.sh also adds.
      - run: apt-get update -qq && apt-get install -y -qq make
      # The same target the devcontainer runs, so CI cannot disagree with a
      # clean local checkout.
      - run: make check

  macos:
    # mlx-swift-lm, the model runtime, needs Swift 6.2 or later (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The core and the Mac app target both build and test on the platform
      # the app ships on.
      - run: swift build
      - run: swift test
      # The bundle that manual testing uses must also build. CI has no model,
      # so the bundle has no classifier; `make model` needs a 9 GB download.
      - run: make app SIGN_ID=-
